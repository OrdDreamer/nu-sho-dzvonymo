<style>
/* Layout: one dark "late-night hallway, phone under a warm lamp" screen; header,
   a rotary dial lit on a table, verdict line, two pill buttons. The dial answers
   through the green display in its hub, where a real phone keeps its number card. */
body { margin: 0 }
[hidden] { display: none !important }
:root {
  --bg-deep: #0A0613;
  --bg-warm: #2E1D40;
  --amber: #F4B942;
  --amber-hot: #FFD98A;
  --amber-dark: #7A4A10;
  --foam: #FFF8EC;
  --ink: #F0E4D2;
  --ink-dim: #B3A08C;
  --on-amber: #2A1705;
  --edge: rgba(244, 185, 66, 0.7);
  --screen: #5BFFA8;
  --font-display: "Oswald", "Arial Narrow", Impact, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --d: min(80vw, 42vh, 340px);
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { height: 100%; }
body {
  background:
    radial-gradient(ellipse 90% 55% at 50% 42%, #2E1D40 0%, #170E22 45%, var(--bg-deep) 100%);
  background-color: var(--bg-deep);
  color: var(--ink);
  font-family: var(--font-body);
  overflow-x: hidden;
}
.app {
  min-height: 100%;
  max-width: 460px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-block: 18px 22px;
  box-sizing: border-box;
  gap: 14px;
}
header { display: grid; grid-template-columns: minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
h1 {
  margin: 0;
  text-align: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(30px, 9.4vw, 54px);
  line-height: 1.05;
  letter-spacing: -0.01em;
  background: linear-gradient(180deg, #FFFFFF 0%, var(--foam) 40%, #FFEAC2 49%, var(--amber-hot) 55%, var(--amber) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 4px 14px rgba(244, 185, 66, 0.35));
  text-wrap: balance;
}
.icon-btn {
  width: 52px; height: 52px;
  border-radius: 50%;
  border: 1px solid rgba(244, 185, 66, 0.28);
  background: radial-gradient(circle at 40% 30%, #2A1B36, #150D1F);
  display: grid; place-items: center;
  color: var(--amber);
  cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255, 228, 180, 0.12);
}
.icon-btn:focus-visible, .spin:focus-visible, .donate:focus-visible { outline: 2px solid var(--amber-hot); outline-offset: 3px; }

.stage {
  flex: 1;
  min-height: calc(var(--d) * 1.08);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.floor {
  position: absolute;
  left: 50%; top: 50%;
  width: calc(var(--d) * 1.7); height: calc(var(--d) * 0.72);
  transform: translate(-50%, 18%);
  background:
    radial-gradient(ellipse 34% 26% at 50% 34%, rgba(255, 206, 120, 0.72), rgba(230, 160, 50, 0.26) 55%, transparent 100%),
    radial-gradient(ellipse 50% 50% at 50% 40%, rgba(90, 50, 10, 0.55), transparent 70%);
  filter: blur(6px);
  pointer-events: none;
}
.bob { animation: bob 4s ease-in-out infinite; filter: drop-shadow(0 calc(var(--d) * 0.03) calc(var(--d) * 0.07) rgba(0, 0, 0, 0.55)); }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

.dial-wrap { width: var(--d); height: var(--d); touch-action: none; }
.dial { width: 100%; height: 100%; display: block; cursor: grab; -webkit-user-select: none; user-select: none; }
.dial:active { cursor: grabbing; }
body.dragging { cursor: grabbing; -webkit-user-select: none; user-select: none; }
.dial-wrap.spinning { animation: tremble 80ms steps(1, end) infinite; }
@keyframes tremble {
  0% { transform: translate(0.9px, -0.6px); }
  25% { transform: translate(-0.8px, 0.7px); }
  50% { transform: translate(0.5px, 0.9px); }
  75% { transform: translate(-0.6px, -0.8px); }
}
.dial-wrap.ringing { animation: ring 0.5s ease-in-out 2; }
@keyframes ring {
  0%, 100% { transform: rotate(0deg); }
  15% { transform: rotate(-2.6deg); }
  38% { transform: rotate(2.6deg); }
  62% { transform: rotate(-1.6deg); }
  82% { transform: rotate(1.1deg); }
}
.digit { font: 600 30px var(--font-body); fill: #FFDFA6; opacity: 0.85; }
.dot-off { fill: #0E3A24; }
.dot-on { fill: var(--screen); }
#screen-on { filter: drop-shadow(0 0 4px rgba(91, 255, 168, 0.85)); }

.verdict {
  margin: 0;
  min-height: 3.2em;
  text-align: center;
  font-size: clamp(17px, 5vw, 21px);
  font-weight: 500;
  line-height: 1.45;
  color: var(--ink);
  text-wrap: balance;
  transition: opacity 0.25s, transform 0.25s;
}
.verdict.out { opacity: 0; transform: translateY(6px); }

.spin {
  height: 74px;
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  font-family: var(--font-body);
  font-weight: 800;
  font-size: 30px;
  color: var(--on-amber);
  background-image:
    var(--handsets, none),
    linear-gradient(180deg, #FFE0A8 0%, var(--amber-hot) 18%, var(--amber) 60%, #A4680F 100%);
  background-size: 190px 190px, 100% 100%;
  box-shadow:
    inset 0 0 0 1.5px rgba(255, 240, 205, 0.85),
    inset 0 -6px 14px rgba(90, 50, 0, 0.35),
    0 0 30px rgba(244, 185, 66, 0.55),
    0 12px 30px rgba(0, 0, 0, 0.45);
  transition: transform 0.12s, filter 0.2s;
}
.spin:active { transform: scale(0.98); }
.spin[aria-busy="true"] { filter: saturate(0.8) brightness(0.92); }

.donate {
  display: flex; align-items: center; gap: 12px;
  height: 78px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1.5px solid var(--edge);
  background: linear-gradient(180deg, rgba(58, 36, 12, 0.75), rgba(26, 15, 5, 0.85));
  box-shadow: 0 0 22px rgba(244, 185, 66, 0.3), inset 0 0 18px rgba(244, 185, 66, 0.12);
  color: var(--ink);
  text-decoration: none;
  cursor: pointer;
}
.mug-tile {
  flex: none;
  width: 56px; height: 56px;
  border-radius: 18px;
  border: 1px solid rgba(244, 185, 66, 0.5);
  background: radial-gradient(circle at 50% 30%, #3A2410, #19100A);
  display: grid; place-items: center;
}
.donate-label { flex: 1; min-width: 0; font-size: clamp(13.5px, 4.1vw, 17px); font-weight: 600; text-align: center; text-wrap: balance; }
.chev {
  flex: none;
  width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid rgba(244, 185, 66, 0.35);
  background: rgba(20, 12, 6, 0.7);
  display: grid; place-items: center; color: var(--amber);
}

.app { transition: opacity 0.2s; }
.app.loading { visibility: hidden; opacity: 0; }
.load-error {
  position: fixed; inset: 0; z-index: 25;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  text-align: center; color: var(--ink); font-size: 16px; line-height: 1.5;
}
.load-error p { margin: 0; max-width: 34ch; }
.load-error button { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--edge); background: transparent; color: var(--amber-hot); font-size: 24px; cursor: pointer; }

.sheet-backdrop {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(6, 3, 10, 0.6);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 460px; box-sizing: border-box;
  background: #1B1026;
  border: 1px solid rgba(244, 185, 66, 0.3);
  border-bottom: 0;
  border-radius: 22px 22px 0 0;
  padding: 20px max(20px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.sheet h2 { margin: 0; font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--foam); }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 16px; }
.row b { color: var(--amber-hot); font-variant-numeric: tabular-nums; font-weight: 800; }
.row.toggle { align-items: center; cursor: pointer; }
.row.toggle input { width: 22px; height: 22px; accent-color: var(--amber); cursor: pointer; }
.hint { margin: 0; font-size: 14px; color: var(--ink-dim); line-height: 1.5; }
input[type="range"] { width: 100%; accent-color: var(--amber); }
.langs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px; border-radius: 999px; border: 1px solid rgba(244, 185, 66, 0.3); background: rgba(20, 12, 6, 0.6); }
.langs button { height: 40px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-dim); font: 700 15px var(--font-body); letter-spacing: 0.06em; cursor: pointer; }
.langs button[aria-checked="true"] { background: var(--amber); color: var(--on-amber); }
.langs button:focus-visible { outline: 2px solid var(--amber-hot); outline-offset: 2px; }
.sheet-close {
  height: 48px; border-radius: 999px; border: 1px solid var(--edge);
  background: transparent; color: var(--ink); font: 600 16px var(--font-body); cursor: pointer;
}

.toast {
  position: fixed; z-index: 30;
  left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  width: min(420px, calc(100% - 36px));
  box-sizing: border-box;
  padding: 12px 16px;
  border-radius: 14px;
  background: #2C1B0C;
  border: 1px solid rgba(244, 185, 66, 0.45);
  color: var(--ink);
  font-size: 15px; line-height: 1.45; text-align: center;
}

@media (prefers-reduced-motion: reduce) {
  .bob { animation: none; }
  .dial-wrap.spinning, .dial-wrap.ringing { animation: none; }
}
</style>
</head>

:"Випадковий дзвінок у кишені не рахується. Треба свідомо."},{"id":"y025","text":"Один гудок — і одразу скинеш. Головне почати."},{"id":"y026","text":"Воно теж дивиться в телефон. Прямо зараз."},{"id":"y027","text":"Якщо не подзвониш — будеш думати про це до ранку."},{"id":"y028","text":"Мовчання триває два роки. Пора його зіпсувати."},{"id":"y029","text":"Ти ж не маніяк. Ти просто дуже хочеш поговорити."},{"id":"y030","text":"Воно тебе не одразу згадає. Тим цікавіше."},{"id":"y031","text":"Дзвонити о 7:58 ранку — це турбота."},{"id":"y032","text":"Автовідповідач теж слухач. І не перебиває."},{"id":"y033","text":"Ти набрав 80% номера. Нечесно зупинятись."},{"id":"y034","text":"Відеозвʼязок не вмикай. Але подзвони."},{"id":"y035","text":"Воно вчора лайкнуло фото 2019 року. Воно готове."},{"id":"y036","text":"У тебе рівно одна причина. Цього достатньо."},{"id":"y037","text":"Текст можна перечитати. Голос — не можна. Дзвони."},{"id":"y038","text":"Раптом там чекають саме твого дзвінка. Трапляється."},{"id":"y039","text":"Зарядки 4%. Значить, розмова буде коротка."},{"id":"y040","text":"Ти вже репетирував перше речення. Двічі."},{"id":"y041","text":"Воно скаже «я якраз про тебе думало». Можливо."},{"id":"y042","text":"Невідомий номер? То подзвони зі свого. Не бійся."},{"id":"y043","text":"Сусіди однаково все чують. Хоч буде що слухати."},{"id":"y044","text":"Хвилина розмови дешевша за тиждень роздумів."},{"id":"y045","text":"Воно прочитало і не відповіло. Отже, чекає дзвінка."},{"id":"y046","text":"Ти набрав і скинув. Тепер треба пояснити. Дзвони."},{"id":"y047","text":"Пропущений від тебе — теж повідомлення."},{"id":"y048","text":"«Привіт, це я» — решта придумається по ходу."},{"id":"y049","text":"Гарнітура заряджена. Доля не дає відмазок."},{"id":"y050","text":"Вона колись сама дзвонила першою. Борг повертаємо."},{"id":"y051","text":"Телефон створений для дзвінків. Шокуюча новина."},{"id":"y052","text":"Твій голос по телефону звучить краще. Чесно."},{"id":"y053","text":"Воно не відповідає з першого разу. Дзвони з третього."},{"id":"y054","text":"Робочий час закінчився — значить можна по-людськи."},{"id":"y055","text":"Ти ж не будеш плакати. Ну, майже."},{"id":"y056","text":"«Поговоримо потім» — потім настало."},{"id":"y057","text":"Кубик бачив твої чернетки повідомлень. Краще подзвони."},{"id":"y058","text":"У тебе ідеальний настрій. Через годину буде гірший."},{"id":"y059","text":"Дзвінок не можна відредагувати. Саме тому він працює."},{"id":"y060","text":"Останній раз. Повторюй за мною: останній раз."}],"no":[{"id":"n001","text":"Не дзвони. Напиши. Або нічого не роби."},{"id":"n002","text":"Поклади телефон. Повільно."},{"id":"n003","text":"Сьогодні твій голос нікому не потрібен. Навіть тобі."},{"id":"n004","text":"Абонент не бажає. І кубик теж."},{"id":"n005","text":"Є речі, які краще не казати вголос."},{"id":"n006","text":"Дзвінок о третій ночі — це не жест, це діагноз."},{"id":"n007","text":"Краще виспись. Номер нікуди не втече."},{"id":"n008","text":"Ні. І не передзвонюй «просто спитати»."},{"id":"n009","text":"Телефон вигадали, щоб ним не користуватись."},{"id":"n010","text":"Залиш людину в спокої. І себе теж."},{"id":"n011","text":"Те, що ти хочеш сказати, завтра здасться дурним."},{"id":"n012","text":"Нехай подзвонить перше. Хоч раз."},{"id":"n013","text":"Кубик проти. Кубик бачив твої вихідні."},{"id":"n014","text":"Ні. Але ти ж все одно подзвониш."}]}</script>
<script type="application/json" id="locale-ru">{"ui":{"title":"Ну что, звоним?","settings":"Настройки","language":"Язык","chance":"Шанс на «ДА»","hint":"0% — режим «не беспокоить», 100% — режим «набираю прямо сейчас».","done":"Готово","spin":"Крути диск!","donate":"Разработчику на телефон","dial":"Дисковый номеронабиратель с ответом","sound":"Звук","toast":"Тут будет ссылка на банку. Обещаю не потратить на роуминг.","yesWord":"ДА","noWord":"НЕТ"},"yes":[{"id":"y001","text":"Оно три раза посмотрело твой сторис. Это приглашение."},{"id":"y002","text":"Написать — это трусость. Звони."},{"id":"y003","text":"Голосовые не считаются. Нужно живым голосом."},{"id":"y004","text":"Один звонок — и всё станет ясно. Ну или хуже."},{"id":"y005","text":"Три ночи — самое честное время для разговора."},{"id":"y006","text":"Оно точно не спит. Люди же не спят."},{"id":"y007","text":"У тебя ещё 400 минут по тарифу. Не пропадать же."},{"id":"y008","text":"Если не ответит — значит просто не услышало."},{"id":"y009","text":"Мама говорила звонить чаще. Мама не говорила кому."},{"id":"y010","text":"Гудки — это уже половина разговора."},{"id":"y011","text":"Оно первым не позвонит. Кто-то должен быть взрослым."},{"id":"y012","text":"Перезвонишь — и сразу завяжешь. Конечно."},{"id":"y013","text":"Телефон уже в руке. Остальное — формальность."},{"id":"y014","text":"На пять минут. Как всегда — на два часа."},{"id":"y015","text":"Тишина в чате означает, что надо звонить."},{"id":"y016","text":"«Набери, как сможешь» — ты же можешь."},{"id":"y017","text":"Номер до сих пор не удалён. Это знак."},{"id":"y018","text":"Ты уже придумал что сказать. Жалко не использовать."},{"id":"y019","text":"Роуминг дорогой, но гордость — дороже."},{"id":"y020","text":"Отмазка готова: «просто проверяю, жив ли ты»."},{"id":"y021","text":"Оно тебя не заблокировало. Значит, ждёт."},{"id":"y022","text":"Связь плохая — будет повод перезвонить."},{"id":"y023","text":"Ты же не спрашиваешь ничего серьёзного. Просто голос послушать."},{"id":"y024","text":"Случайный звонок в кармане не считается. Надо осознанно."},{"id":"y025","text":"Один гудок — и сразу сбросишь. Главное начать."},{"id":"y026","text":"Оно тоже смотрит в телефон. Прямо сейчас."},{"id":"y027","text":"Если не позвонишь — будешь думать об этом до утра."},{"id":"y028","text":"Молчание длится два года. Пора его испортить."},{"id":"y029","text":"Ты же не маньяк. Ты просто очень хочешь поговорить."},{"id":"y030","text":"Оно тебя не сразу вспомнит. Тем интереснее."},{"id":"y031","text":"Звонить в 7:58 утра — это забота."},{"id":"y032","text":"Автоответчик тоже слушатель. И не перебивает."},{"id":"y033","text":"Ты набрал 80% номера. Нечестно останавливаться."},{"id":"y034","text":"Видеосвязь не включай. Но позвони."},{"id":"y035","text":"Оно вчера лайкнуло фото 2019 года. Оно готово."},{"id":"y036","text":"У тебя ровно одна причина. Этого достаточно."},{"id":"y037","text":"Текст можно перечитать. Голос — нельзя. Звони."},{"id":"y038","text":"А вдруг там ждут именно твоего звонка. Бывает."},{"id":"y039","text":"Заряда 4%. Значит, разговор будет короткий."},{"id":"y040","text":"Ты уже репетировал первую фразу. Дважды."},{"id":"y041","text":"Оно скажет «я как раз о тебе думало». Возможно."},{"id":"y042","text":"Неизвестный номер? Так позвони со своего. Смелее."},{"id":"y043","text":"Соседи всё равно всё слышат. Пусть будет что слушать."},{"id":"y044","text":"Минута разговора дешевле недели раздумий."},{"id":"y045","text":"Оно прочитало и не ответило. Значит, ждёт звонка."},{"id":"y046","text":"Ты набрал и сбросил. Теперь надо объяснить. Звони."},{"id":"y047","text":"Пропущенный от тебя — тоже сообщение."},{"id":"y048","text":"«Привет, это я» — остальное придумается по ходу."},{"id":"y049","text":"Наушники заряжены. Судьба не оставила отмазок."},{"id":"y050","text":"Оно когда-то звонило первым. Долг возвращаем."},{"id":"y051","text":"Телефон создан для звонков. Шокирующая новость."},{"id":"y052","text":"Твой голос по телефону звучит лучше. Честно."},{"id":"y053","text":"С первого раза не отвечает. Звони с третьего."},{"id":"y054","text":"Рабочий день кончился — значит можно по-человечески."},{"id":"y055","text":"Ты же не будешь плакать. Ну, почти."},{"id":"y056","text":"«Поговорим потом» — потом наступило."},{"id":"y057","text":"Кубик видел твои черновики сообщений. Лучше позвони."},{"id":"y058","text":"У тебя идеальное настроение. Через час будет хуже."},{"id":"y059","text":"Звонок нельзя отредактировать. Именно поэтому он работает."},{"id":"y060","text":"Последний раз. Повторяй за мной: последний раз."}],"no":[{"id":"n001","text":"Не звони. Напиши. Или не делай ничего."},{"id":"n002","text":"Положи телефон. Медленно."},{"id":"n003","text":"Сегодня твой голос никому не нужен. Даже тебе."},{"id":"n004","text":"Абонент не желает. И кубик тоже."},{"id":"n005","text":"Есть вещи, которые лучше не говорить вслух."},{"id":"n006","text":"Звонок в три ночи — это не жест, это диагноз."},{"id":"n007","text":"Лучше выспись. Номер никуда не денется."},{"id":"n008","text":"Нет. И не перезванивай «просто спросить»."},{"id":"n009","text":"Телефон придумали, чтобы им не пользоваться."},{"id":"n010","text":"Оставь человека в покое. И себя тоже."},{"id":"n011","text":"То, что ты хочешь сказать, завтра покажется глупым."},{"id":"n012","text":"Пусть позвонит первым. Хоть раз."},{"id":"n013","text":"Кубик против. Кубик видел твои выходные."},{"id":"n014","text":"Нет. Но ты же всё равно позвонишь."}]}</script>
<script type="application/json" id="locale-en">{"ui":{"title":"So, do we call?","settings":"Settings","language":"Language","chance":"Chance of “YES”","hint":"0% — do-not-disturb mode, 100% — dialling-right-now mode.","done":"Done","spin":"Spin the dial!","donate":"Top up the dev’s phone","dial":"Rotary dial showing the answer","sound":"Sound","toast":"A donation link goes here. I promise not to spend it on roaming.","yesWord":"YES","noWord":"NO"},"yes":[{"id":"y001","text":"They watched your story three times. That is an invitation."},{"id":"y002","text":"Texting is cowardice. Call."},{"id":"y003","text":"Voice notes don’t count. It has to be live."},{"id":"y004","text":"One call and everything is clear. Or worse."},{"id":"y005","text":"3 a.m. is the most honest hour for a conversation."},{"id":"y006","text":"They are definitely awake. Nobody sleeps anyway."},{"id":"y007","text":"You still have 400 minutes on the plan. Don’t waste them."},{"id":"y008","text":"If they don’t pick up, they simply didn’t hear it."},{"id":"y009","text":"Mum said call more often. Mum never said who."},{"id":"y010","text":"The ringing tone is already half a conversation."},{"id":"y011","text":"They won’t call first. Someone has to be the adult."},{"id":"y012","text":"You’ll call back once and then quit. Obviously."},{"id":"y013","text":"The phone is already in your hand. The rest is paperwork."},{"id":"y014","text":"Five minutes, tops. As always — two hours."},{"id":"y015","text":"Silence in the chat means it’s time to call."},{"id":"y016","text":"“Call me whenever you can” — and you can."},{"id":"y017","text":"The number is still not deleted. That’s a sign."},{"id":"y018","text":"You’ve already drafted the opening line. Don’t waste it."},{"id":"y019","text":"Roaming is expensive, but pride costs more."},{"id":"y020","text":"Excuse ready: “just checking whether you’re alive”."},{"id":"y021","text":"They haven’t blocked you. So they’re waiting."},{"id":"y022","text":"Bad signal means a reason to call again."},{"id":"y023","text":"You’re not asking anything serious. Just hearing a voice."},{"id":"y024","text":"A pocket dial doesn’t count. Do it on purpose."},{"id":"y025","text":"One ring, then hang up. Starting is the hard part."},{"id":"y026","text":"They’re staring at their phone too. Right now."},{"id":"y027","text":"If you don’t call you’ll think about it until morning."},{"id":"y028","text":"The silence is two years old. Time to ruin it."},{"id":"y029","text":"You’re not a stalker. You just really want to talk."},{"id":"y030","text":"They won’t recognise you right away. Even better."},{"id":"y031","text":"Calling at 7:58 a.m. counts as caring."},{"id":"y032","text":"Voicemail is a listener too. And it never interrupts."},{"id":"y033","text":"You’ve dialled 80% of the number. Stopping is unfair."},{"id":"y034","text":"Keep the video off. But call."},{"id":"y035","text":"They liked a photo from 2019 yesterday. They’re ready."},{"id":"y036","text":"You have exactly one reason. That is plenty."},{"id":"y037","text":"A text can be reread. A voice can’t. Call."},{"id":"y038","text":"What if they’re waiting for exactly your call. Happens."},{"id":"y039","text":"Battery at 4%. So the call will be short."},{"id":"y040","text":"You rehearsed the first sentence. Twice."},{"id":"y041","text":"They’ll say “I was just thinking about you”. Possibly."},{"id":"y042","text":"Unknown number? Then call from your own. Be brave."},{"id":"y043","text":"The neighbours hear everything anyway. Give them material."},{"id":"y044","text":"A minute on the phone is cheaper than a week of thinking."},{"id":"y045","text":"They read it and said nothing. So they want a call."},{"id":"y046","text":"You dialled and hung up. Now you owe an explanation."},{"id":"y047","text":"A missed call from you is a message too."},{"id":"y048","text":"“Hi, it’s me” — the rest writes itself."},{"id":"y049","text":"Your earbuds are charged. Fate left you no excuses."},{"id":"y050","text":"They called first once. Debts get repaid."},{"id":"y051","text":"Phones were built for calling. Shocking news."},{"id":"y052","text":"Your voice sounds better on the phone. Honestly."},{"id":"y053","text":"No answer the first time? Call the third time."},{"id":"y054","text":"Office hours are over, so you can be human now."},{"id":"y055","text":"You won’t cry. Well, almost."},{"id":"y056","text":"“Let’s talk later” — later has arrived."},{"id":"y057","text":"The die has seen your unsent drafts. Just call."},{"id":"y058","text":"Your mood is perfect right now. In an hour it won’t be."},{"id":"y059","text":"A call can’t be edited. That’s exactly why it works."},{"id":"y060","text":"Last time. Say it with me: last time."}],"no":[{"id":"n001","text":"Don’t call. Text. Or do nothing at all."},{"id":"n002","text":"Put the phone down. Slowly."},{"id":"n003","text":"Nobody needs your voice today. Not even you."},{"id":"n004","text":"The subscriber would rather not. Neither would the die."},{"id":"n005","text":"Some things are better left unsaid out loud."},{"id":"n006","text":"A 3 a.m. call isn’t a gesture, it’s a diagnosis."},{"id":"n007","text":"Get some sleep. The number isn’t going anywhere."},{"id":"n008","text":"No. And don’t call back “just to ask something”."},{"id":"n009","text":"The phone was invented so you wouldn’t use it."},{"id":"n010","text":"Leave them alone. Yourself too."},{"id":"n011","text":"Whatever you want to say will sound silly tomorrow."},{"id":"n012","text":"Let them call first. Just once."},{"id":"n013","text":"The die says no. The die saw your weekend."},{"id":"n014","text":"No. But you’ll call anyway."}]}</script>

    const baked = inlineLocale(l);
    if (baked) {
      raw[l] = Promise.resolve(baked);
      return raw[l];
    }
    const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), LOAD_TIMEOUT) : null;
    raw[l] = fetch('locales/' + l + '.json', ctrl ? { signal: ctrl.signal } : undefined)
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .finally(() => { if (timer) clearTimeout(timer); });
    raw[l].catch(() => { delete raw[l]; });
    return raw[l];
  }
  function mergeList(base, over) {
    if (!base) return over || [];
    const byId = {};
    (over || []).forEach(x => { if (x && x.id && x.text) byId[x.id] = x.text; });
    return base.map(x => ({ id: x.id, text: byId[x.id] || x.text }));
  }
  function buildDict(main, fallback) {
    if (!fallback || main === fallback) return main;
    return {
      ui: Object.assign({}, fallback.ui, main.ui),
      yes: mergeList(fallback.yes, main.yes),
      no: mergeList(fallback.no, main.no)
    };
  }
  function loadDict(l) {
    if (l === DEFAULT_LANG) return fetchLocale(l).then(d => ({ lang: l, dict: d }));
    const fb = fetchLocale(DEFAULT_LANG).catch(() => null);
    return fetchLocale(l)
      .then(main => fb.then(f => ({ lang: l, dict: buildDict(main, f) })))
      .catch(() => fb.then(f => { if (!f) throw new Error('no locales'); return { lang: DEFAULT_LANG, dict: f }; }));
  }

  /* ---- bakelite texture: scattered handsets, seamless across the tile ---- */
  function makeHandsets() {
    const n = 220, cv = document.createElement('canvas');
    cv.width = cv.height = n;
    const g = cv.getContext('2d');
    const path = new Path2D(PHONE_PATH);
    const wrap = [-n, 0, n];
    const stamp = fn => wrap.forEach(dx => wrap.forEach(dy => { g.save(); g.translate(dx, dy); fn(); g.restore(); }));

    for (let i = 0; i < 13; i++) {
      const x = Math.random() * n, y = Math.random() * n;
      const size = 20 + Math.random() * 22;
      const rot = (Math.random() - 0.5) * 1.8;
      stamp(() => {
        g.translate(x, y); g.rotate(rot); g.scale(size / 24, size / 24); g.translate(-12, -12);
        g.fillStyle = 'rgba(255, 246, 225, 0.14)'; g.fill(path);
        g.lineWidth = 1.3; g.strokeStyle = 'rgba(255, 238, 200, 0.5)'; g.stroke(path);
      });
    }
    for (let i = 0; i < 70; i++) {
      const x = Math.random() * n, y = Math.random() * n;
      const r = Math.random() < 0.8 ? 0.8 + Math.random() * 1.6 : 2.6 + Math.random() * 2;
      stamp(() => {
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2);
        g.fillStyle = 'rgba(255, 244, 215, 0.12)'; g.fill();
        g.lineWidth = 0.8; g.strokeStyle = 'rgba(255, 236, 190, 0.4)'; g.stroke();
      });
    }
    return cv.toDataURL('image/png');
  }
  try {
    const tex = makeHandsets();
    document.documentElement.style.setProperty('--handsets', 'url(' + tex + ')');
    document.getElementById('tex-img').setAttribute('href', tex);
  } catch (e) {}

  /* ---- the dial ----
     Digits sit on the fixed plate; the finger wheel with its ten holes turns over
     them, exactly like the real thing. Pulling hole N round to the finger stop is
     30*N degrees, and the governed return back home ticks N times. */
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const CX = 200, WHEEL_R = 190, HUB_R = 78, ORBIT = 136, HOLE_R = 26;
  const STOP_ANGLE = 135, STEP = 30, MAX_PULSES = 10;
  const LABELS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'];

  function at(angle, radius) {
    const t = angle * Math.PI / 180;
    return [CX + radius * Math.sin(t), CX - radius * Math.cos(t)];
  }
  function holeAngle(i) { return 105 - i * STEP; }
  function circlePath(cx, cy, r) {
    return 'M' + (cx - r) + ',' + cy + 'a' + r + ',' + r + ' 0 1,0 ' + (2 * r) + ',0' +
           'a' + r + ',' + r + ' 0 1,0 ' + (-2 * r) + ',0Z';
  }
  function el(name, attrs) {
    const n = document.createElementNS(SVG_NS, name);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  const wheel = document.getElementById('wheel');
  const dialSvg = document.getElementById('dial');
  const dialWrap = document.getElementById('dial-wrap');

  (function buildDial() {
    let d = circlePath(CX, CX, WHEEL_R) + circlePath(CX, CX, HUB_R);
    const digits = document.getElementById('digits');
    for (let i = 0; i < LABELS.length; i++) {
      const p = at(holeAngle(i), ORBIT);
      d += circlePath(p[0], p[1], HOLE_R);
      const t = el('text', { x: p[0], y: p[1] + 10, 'text-anchor': 'middle', class: 'digit' });
      t.textContent = LABELS[i];
      digits.appendChild(t);
    }
    document.getElementById('wheel-face').setAttribute('d', d);
    document.getElementById('wheel-tex').setAttribute('d', d);

    /* the finger stop: a blade on the fixed plate, lying along the radius at 4:30,
       poking just past the wheel rim so the hole you pull round runs into it */
    const s = at(STOP_ANGLE, 152);
    const place = 'translate(' + s[0] + ' ' + s[1] + ') rotate(' + (STOP_ANGLE - 180) + ')';
    const stop = document.getElementById('stop');
    stop.appendChild(el('rect', {
      x: -17, y: -46, width: 34, height: 92, rx: 16, transform: place,
      fill: 'url(#bezel)', stroke: 'rgba(0,0,0,0.5)', 'stroke-width': 2
    }));
    stop.appendChild(el('rect', {
      x: -7, y: -34, width: 14, height: 62, rx: 7, transform: place,
      fill: 'rgba(255,245,220,0.45)'
    }));
  })();

  /* ---- the green dot-matrix display in the hub ---- */
  const GLYPHS = {
    A: ['01110', '10001', '10001', '11111', '10001', '10001', '10001'],
    T: ['11111', '00100', '00100', '00100', '00100', '00100', '00100'],
    K: ['10001', '10010', '10100', '11000', '10100', '10010', '10001'],
    H: ['10001', '10001', '10001', '11111', '10001', '10001', '10001'],
    I: ['01110', '00100', '00100', '00100', '00100', '00100', '01110'],
    D: ['01110', '01010', '01010', '01010', '01010', '11111', '10001'],
    E: ['11111', '10000', '10000', '11110', '10000', '10000', '11111'],
    Y: ['10001', '10001', '01010', '00100', '00100', '00100', '00100'],
    S: ['01111', '10000', '10000', '01110', '00001', '00001', '11110'],
    N: ['10001', '11001', '11001', '10101', '10011', '10011', '10001'],
    O: ['01110', '10001', '10001', '10001', '10001', '10001', '01110']
  };
  /* Cyrillic and Latin look-alikes share one glyph */
  const FOLD = { 'А': 'A', 'Т': 'T', 'К': 'K', 'Н': 'H', 'І': 'I', 'Д': 'D', 'Е': 'E', 'О': 'O' };
  const COLS = 17, ROWS = 7, PITCH = 7.3, DOT_R = 2.7;
  const originX = CX - (COLS - 1) * PITCH / 2;
  const originY = CX - (ROWS - 1) * PITCH / 2;
  const screenOn = document.getElementById('screen-on');

  (function buildScreen() {
    const off = document.getElementById('screen-off');
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        off.appendChild(el('circle', {
          cx: originX + c * PITCH, cy: originY + r * PITCH, r: DOT_R, class: 'dot-off'
        }));
      }
    }
  })();

  function paint(cells) {
    while (screenOn.firstChild) screenOn.removeChild(screenOn.firstChild);
    cells.forEach(p => screenOn.appendChild(el('circle', {
      cx: originX + p[0] * PITCH, cy: originY + p[1] * PITCH, r: DOT_R, class: 'dot-on'
    })));
  }
  function showWord(word) {
    const chars = String(word || '').toUpperCase().split('')
      .map(ch => GLYPHS[FOLD[ch] || ch]).filter(Boolean);
    if (!chars.length) return paint([]);
    const width = chars.length * 5 + (chars.length - 1);
    const left = Math.round((COLS - width) / 2);
    const cells = [];
    chars.forEach((glyph, gi) => {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < 5; c++) {
          if (glyph[r][c] === '1') cells.push([left + gi * 6 + c, r]);
        }
      }
    });
    paint(cells);
  }
  function showNoise() {
    const cells = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) if (Math.random() < 0.16) cells.push([c, r]);
    }
    paint(cells);
  }

  /* ---- sound: the ratchet is synthesised, no audio files ---- */
  let soundOn = true;
  try { soundOn = localStorage.getItem(SOUND_KEY) !== '0'; } catch (e) {}
  let actx = null, noise = null;

  function audio() {
    if (!soundOn) return null;
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { actx = new AC(); } catch (e) { return null; }
    }
    if (actx.state === 'suspended') { try { actx.resume(); } catch (e) {} }
    if (!noise) {
      const n = Math.floor(actx.sampleRate * 0.12);
      noise = actx.createBuffer(1, n, actx.sampleRate);
      const data = noise.getChannelData(0);
      for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
    }
    return actx;
  }
  function blip(freq, gain, decay, q) {
    const ac = audio();
    if (!ac) return;
    const t = ac.currentTime;
    const src = ac.createBufferSource();
    src.buffer = noise;
    src.playbackRate.value = 0.8 + Math.random() * 0.4;
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = freq;
    bp.Q.value = q;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    src.connect(bp); bp.connect(g); g.connect(ac.destination);
    src.start(t);
    src.stop(t + decay + 0.02);
  }
  const tick = () => blip(1800 + Math.random() * 700, 0.2, 0.05, 1.1);
  const softTick = () => blip(1400 + Math.random() * 400, 0.06, 0.03, 1.4);
  const thud = () => blip(300, 0.3, 0.13, 0.7);
  const home = () => blip(220, 0.22, 0.16, 0.6);

  /* ---- app wiring ---- */
  const app = document.getElementById('app');
  const loadError = document.getElementById('load-error');
  const verdict = document.getElementById('verdict');
  const spinBtn = document.getElementById('spin');
  const toast = document.getElementById('toast');
  const sheet = document.getElementById('sheet');
  const chance = document.getElementById('chance');
  const chanceOut = document.getElementById('chance-out');
  const soundBox = document.getElementById('sound');
  const langBtns = Array.from(document.querySelectorAll('#langs [data-lang]'));

  try {
    const saved = localStorage.getItem(CHANCE_KEY);
    if (saved !== null) chance.value = saved;
  } catch (e) {}
  chanceOut.textContent = chance.value + '%';
  chance.addEventListener('input', () => {
    chanceOut.textContent = chance.value + '%';
    try { localStorage.setItem(CHANCE_KEY, chance.value); } catch (e) {}
  });

  soundBox.checked = soundOn;
  soundBox.addEventListener('change', () => {
    soundOn = soundBox.checked;
    try { localStorage.setItem(SOUND_KEY, soundOn ? '1' : '0'); } catch (e) {}
    if (soundOn) softTick();
  });

  let lang = langFromUrl() || savedLang() || DEFAULT_LANG;
  let dict = null;
  let isYes = true, currentId = null, lastId = null;
  let angle = 0, busy = false, noiseTimer = 0;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function list(yes) { return yes ? dict.yes : dict.no; }
  function pickId(yes) {
    const l = list(yes);
    if (!l.length) return null;
    let item;
    do { item = l[Math.floor(Math.random() * l.length)]; } while (l.length > 1 && item.id === lastId);
    lastId = item.id;
    return item.id;
  }
  function lineText() {
    const hit = list(isYes).find(x => x.id === currentId);
    return hit ? hit.text : '';
  }
  function answerText() { return isYes ? dict.ui.yesWord : dict.ui.noWord; }

  function setAngle(a) {
    angle = a;
    wheel.setAttribute('transform', 'rotate(' + a.toFixed(2) + ' ' + CX + ' ' + CX + ')');
  }

  function render() {
    const d = dict.ui;
    document.documentElement.lang = lang;
    document.title = d.title;
    document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = d[e.dataset.i18n] || ''; });
    document.getElementById('settings-btn').setAttribute('aria-label', d.settings);
    dialSvg.setAttribute('aria-label', d.dial);
    if (!list(isYes).some(x => x.id === currentId)) currentId = pickId(isYes);
    showWord(answerText());
    verdict.textContent = lineText();
    langBtns.forEach(b => b.setAttribute('aria-checked', String(b.dataset.lang === lang)));
  }

  function ring() {
    if (reduce) return;
    dialWrap.classList.remove('ringing');
    void dialWrap.offsetWidth;
    dialWrap.classList.add('ringing');
    setTimeout(() => dialWrap.classList.remove('ringing'), 1050);
  }

  function finish(result) {
    setAngle(0);
    clearInterval(noiseTimer); noiseTimer = 0;
    dialWrap.classList.remove('spinning');
    isYes = result.yes;
    currentId = result.id;
    showWord(answerText());
    verdict.textContent = lineText();
    verdict.classList.remove('out');
    busy = false;
    spinBtn.removeAttribute('aria-busy');
    home();
    if (isYes) ring();
    try { if (navigator.vibrate) navigator.vibrate(isYes ? [30, 90, 30] : 30); } catch (e) {}
  }

  /* wind: pull the wheel round first (the button does this; a drag already did it) */
  function roll(pulses, from, wind) {
    busy = true;
    spinBtn.setAttribute('aria-busy', 'true');
    verdict.classList.add('out');
    const yes = Math.random() * 100 < Number(chance.value);
    const result = { yes: yes, id: pickId(yes) };

    clearInterval(noiseTimer);
    noiseTimer = setInterval(showNoise, 70);
    showNoise();
    if (!reduce) dialWrap.classList.add('spinning');

    const target = pulses * STEP;
    const windMs = wind ? (reduce ? 1 : 220 + target * 1.1) : 0;
    const holdMs = wind ? (reduce ? 1 : 110) : 0;
    const backMs = reduce ? 1 : pulses * 100;
    const start = performance.now();
    let ticks = 0, hit = !wind;

    (function frame(now) {
      const t = now - start;
      if (t < windMs) {
        setAngle(from + (target - from) * (1 - Math.pow(1 - t / windMs, 3)));
      } else if (t < windMs + holdMs) {
        setAngle(target);
        if (!hit) { hit = true; thud(); }
      } else {
        const base = wind ? target : from;
        const p = Math.min(1, (t - windMs - holdMs) / backMs);
        setAngle(base * (1 - p));
        const want = Math.floor(p * pulses);
        while (ticks < want) { ticks++; tick(); }
        if (p >= 1) return finish(result);
      }
      requestAnimationFrame(frame);
    })(performance.now());
  }

  function randomRoll() {
    if (busy || !dict) return;
    roll(4 + Math.floor(Math.random() * (MAX_PULSES - 3)), 0, true);
  }
  spinBtn.addEventListener('click', randomRoll);

  /* ---- drag: put a finger in a hole, pull to the stop, let go ----
     The pull is accumulated move by move rather than measured against the grab
     point: a difference from the grab point has to be wrapped into +-180, and a
     pull past half a turn then reads as a pull backwards and collapses the wheel.
     Moves are tracked on the window, so once the pull has started the pointer may
     wander anywhere - across the display, off the dial, off the page - and only
     its bearing from the centre of the dial counts. Right at that centre a pixel
     of travel is tens of degrees, so the middle is a dead zone where the wheel
     holds still instead of lurching. */
  const DEAD_ZONE = 0.14;
  let dragging = false, lastAim = 0, dragAngle = 0, travelled = 0, dragTicks = 0;

  function polar(e) {
    const r = dialSvg.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2);
    const dy = e.clientY - (r.top + r.height / 2);
    return {
      aim: Math.atan2(dx, -dy) * 180 / Math.PI,
      reach: Math.hypot(dx, dy) / (r.width / 2)
    };
  }
  function wrapDeg(a) {
    while (a > 180) a -= 360;
    while (a < -180) a += 360;
    return a;
  }
  /* let go short of the stop and the wheel eases home instead of snapping */
  function springHome(from) {
    const ms = reduce ? 1 : 170;
    const t0 = performance.now();
    (function frame(now) {
      const p = Math.min(1, (now - t0) / ms);
      setAngle(from * (1 - p * p * (3 - 2 * p)));
      if (p < 1) requestAnimationFrame(frame); else softTick();
    })(performance.now());
  }

  function onDragMove(e) {
    if (!dragging) return;
    const p = polar(e);
    const delta = wrapDeg(p.aim - lastAim);
    lastAim = p.aim;
    if (p.reach < DEAD_ZONE) return;
    dragAngle = Math.max(0, Math.min(MAX_PULSES * STEP, dragAngle + delta));
    travelled = Math.max(travelled, dragAngle);
    const crossed = Math.floor(dragAngle / STEP);
    while (dragTicks < crossed) { dragTicks++; softTick(); }
    dragTicks = crossed;
    setAngle(dragAngle);
  }
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove('dragging');
    removeEventListener('pointermove', onDragMove);
    removeEventListener('pointerup', endDrag);
    removeEventListener('pointercancel', endDrag);
    removeEventListener('blur', endDrag);
    const pulses = Math.round(dragAngle / STEP);
    if (pulses >= 1) { roll(pulses, dragAngle, false); return; }
    if (travelled < 4) { setAngle(0); randomRoll(); return; }
    springHome(dragAngle);
  }

  dialSvg.addEventListener('pointerdown', e => {
    if (busy || !dict) return;
    e.preventDefault();
    dragging = true;
    dragAngle = 0;
    travelled = 0;
    dragTicks = 0;
    lastAim = polar(e).aim;
    document.body.classList.add('dragging');
    try { dialSvg.setPointerCapture(e.pointerId); } catch (err) {}
    addEventListener('pointermove', onDragMove);
    addEventListener('pointerup', endDrag);
    addEventListener('pointercancel', endDrag);
    addEventListener('blur', endDrag);
  });

  /* ---- boot ---- */
  function start() {
    loadError.hidden = true;
    loadDict(lang).then(r => {
      lang = r.lang; dict = r.dict;
      currentId = pickId(true);
      render();
      app.classList.remove('loading');
    }).catch(() => { loadError.hidden = false; });
  }
  document.getElementById('retry').addEventListener('click', start);
  start();

  langBtns.forEach(b => b.addEventListener('click', () => {
    const next = b.dataset.lang;
    if (next === lang && dict) return;
    writeCookie(COOKIE, next);
    syncUrl(next);
    langBtns.forEach(x => x.setAttribute('aria-checked', String(x.dataset.lang === next)));
    loadDict(next).then(r => { lang = r.lang; dict = r.dict; render(); }).catch(() => {
      langBtns.forEach(x => x.setAttribute('aria-checked', String(x.dataset.lang === lang)));
    });
  }));

  let toastTimer;
  function showToast(text) {
    toast.textContent = text;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, 3200);
  }
  const donate = document.getElementById('donate');
  if (DONATE_URL) {
    donate.href = DONATE_URL;
    donate.target = '_blank';
    donate.rel = 'noopener';
  } else {
    donate.addEventListener('click', e => {
      e.preventDefault();
      if (dict) showToast(dict.ui.toast);
    });
  }

  document.getElementById('settings-btn').addEventListener('click', () => { sheet.hidden = false; chance.focus(); });
  document.getElementById('sheet-close').addEventListener('click', () => { sheet.hidden = true; });
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.hidden = true; });
  addEventListener('keydown', e => { if (e.key === 'Escape') sheet.hidden = true; });
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
</script>
</body>
</html>
